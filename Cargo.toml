[workspace]
resolver = "2"
members = [ "crates/*" ]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2021"
authors = ["JunctionRS Contributors <zojeda@gmail.com>"]
repository = "https://github.com/zojeda/junction-rs"
description = "JunctionRS: Async-first Object Graph Mapper (OGM) for Rust"


[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
surrealdb = { version = "2", features = ["kv-mem"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
uuid = { version = "1", features = ["v4", "serde", "std"] }
thiserror = "1"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
trybuild = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
regex = "1"
walkdir = "2"
async-trait = "0.1"
sha2 = "0.10"
colored = "2"
hex = "0.4"
inventory = "0.3"
cargo_metadata = "0.18"
dialoguer = "0.11"
toml_edit = "0.22"
assert_cmd = "2"

[workspace.lints]
rust.unused_crate_dependencies = "warn"
rust.unused_extern_crates = "warn"
rust.unused_imports = "warn"
rust.unreachable_pub = "deny"
rust.missing_docs = "warn"
clippy.all = { level = "warn", priority = -1 }
clippy.pedantic = { level = "warn", priority = -1 }
clippy.nursery = { level = "warn", priority = -1 }
clippy.unwrap_used = "deny"
clippy.expect_used = "deny"
clippy.todo = "deny"
clippy.unimplemented = "deny"
clippy.use_self = "warn"
clippy.enum_glob_use = "deny"
clippy.wildcard_imports = "deny"
clippy.disallowed_methods = "warn"
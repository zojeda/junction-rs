[package]
name = "junction-cli"
version = "0.0.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line tools for JunctionRS (migrations, schema snapshots, inspection)"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
walkdir = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
colored = { workspace = true }
hex = { workspace = true }
inventory = { workspace = true }
junction-rs-surrealdb = { path = "../junction-rs-surrealdb", optional = true }
surrealdb = { workspace = true, optional = true }
# Link to core crates for future integration
junction-rs = { path = "../junction-rs" }
junction-rs-core = { path = "../junction-rs-core" }
cargo_metadata = { workspace = true }
dialoguer = { workspace = true }
toml_edit = { workspace = true }

[[bin]]
name = "junction"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = { workspace = true }

[features]
default = []
adapter-surreal = ["junction-rs-surrealdb", "surrealdb"]

[package]
name = "junction-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "An experimental, async-first, type-safe Object Graph Mapper (OGM) for Rust — a graph-oriented ORM-ish toolkit focused on Nodes, Edges & fluent traversal-friendly queries."

[lib]
name = "junction_rs"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
junction-rs-core = { path = "../junction-rs-core" }
junction-rs-macros = { path = "../junction-rs-macros" }
junction-rs-surrealdb = { path = "../junction-rs-surrealdb", optional = true }

[features]
default = ["surreal"]
surreal = ["junction-rs-surrealdb"]

[dev-dependencies]
tokio = { workspace = true }